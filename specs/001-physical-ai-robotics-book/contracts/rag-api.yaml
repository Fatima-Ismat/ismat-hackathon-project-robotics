openapi: 3.0.3
info:
  title: Physical AI Book - RAG API
  description: |
    REST API for the Physical AI & Humanoid Robotics Book RAG (Retrieval-Augmented Generation) system.
    Enables select-text-to-ask-AI functionality for interactive learning.

    **Features**:
    - Semantic search over book content using Qdrant vector database
    - Grounded responses (book content only, no hallucinations)
    - Rate limiting: 10 requests/minute per IP
    - Free-tier architecture: Qdrant Cloud + Neon PostgreSQL + sentence-transformers

    **Authentication**: None (public API)
    **Base URL**: https://your-app.render.com (or Railway/Fly.io deployment)
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://physical-ai-book-api.onrender.com
    description: Production (Render.com free tier)
  - url: http://localhost:8000
    description: Local development

tags:
  - name: query
    description: RAG query operations
  - name: health
    description: System health and monitoring

paths:
  /api/v1/query:
    post:
      tags:
        - query
      summary: Submit RAG query
      description: |
        Process a user query about book content using RAG (Retrieval-Augmented Generation).

        **Flow**:
        1. Client sends user's question + selected text context + current chapter
        2. Backend embeds query using sentence-transformers/all-MiniLM-L6-v2
        3. Qdrant searches for semantically similar book chunks
        4. FastAPI generates grounded answer from retrieved context
        5. Response includes answer + source citations (chapter/section references)

        **Rate Limiting**: 10 requests/minute per IP address (429 if exceeded)
        **Latency Target**: p95 < 3 seconds
      operationId: submitQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            examples:
              ros2_query:
                summary: ROS 2 communication protocol
                value:
                  selected_text: "ROS 2 uses DDS for communication between nodes"
                  query: "What protocol does ROS 2 use for inter-process communication?"
                  chapter_id: "ros-2-fundamentals"
              isaac_query:
                summary: NVIDIA Isaac Sim features
                value:
                  selected_text: "Isaac Sim provides photorealistic rendering and physics simulation"
                  query: "What are the key features of Isaac Sim?"
                  chapter_id: "nvidia-isaac-ai-platform"
      responses:
        '200':
          description: Successful query response
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per minute
              schema:
                type: integer
                example: 10
            X-RateLimit-Remaining:
              description: Remaining requests in current window
              schema:
                type: integer
                example: 7
            X-RateLimit-Reset:
              description: Unix timestamp when rate limit resets
              schema:
                type: integer
                example: 1701785600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              examples:
                ros2_response:
                  summary: ROS 2 DDS protocol answer
                  value:
                    answer: "ROS 2 uses DDS (Data Distribution Service) as its middleware communication protocol. DDS provides real-time, peer-to-peer, publish-subscribe communication between ROS 2 nodes. It enables decoupled, scalable, and secure inter-process communication across different machines and operating systems."
                    sources:
                      - chapter: "ros-2-fundamentals"
                        section: "communication-middleware"
                        relevance_score: 0.94
                      - chapter: "ros-2-fundamentals"
                        section: "distributed-systems"
                        relevance_score: 0.87
                    latency_ms: 287
                    metadata:
                      embedding_time_ms: 58
                      qdrant_time_ms: 102
                      num_chunks_retrieved: 5
        '400':
          description: Invalid request (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                query_too_short:
                  summary: Query text too short
                  value:
                    error: "Validation Error"
                    message: "Query must be between 5 and 500 characters"
                    code: "INVALID_QUERY_LENGTH"
                    timestamp: "2025-12-04T18:30:15Z"
                invalid_chapter:
                  summary: Invalid chapter ID
                  value:
                    error: "Validation Error"
                    message: "Chapter ID 'invalid-chapter' not found"
                    code: "CHAPTER_NOT_FOUND"
                    timestamp: "2025-12-04T18:30:20Z"
        '429':
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
                example: 10
            X-RateLimit-Remaining:
              schema:
                type: integer
                example: 0
            X-RateLimit-Reset:
              schema:
                type: integer
                example: 1701785660
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Rate Limit Exceeded"
                message: "Too many requests. Please wait 60 seconds before trying again."
                code: "RATE_LIMIT_EXCEEDED"
                timestamp: "2025-12-04T18:31:00Z"
        '503':
          description: Service unavailable (Qdrant/Neon connection failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Service Unavailable"
                message: "AI assistant temporarily unavailable. Please try again later."
                code: "BACKEND_UNAVAILABLE"
                timestamp: "2025-12-04T18:32:00Z"

  /api/v1/health:
    get:
      tags:
        - health
      summary: Health check
      description: |
        Check system health including Qdrant and Neon PostgreSQL connectivity.
        Used for graceful degradation (hide Ask AI button if backend unhealthy).
      operationId: healthCheck
      responses:
        '200':
          description: All systems operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                timestamp: "2025-12-04T18:33:00Z"
                services:
                  qdrant:
                    status: "connected"
                    latency_ms: 45
                  neon:
                    status: "connected"
                    latency_ms: 28
                  embedding_model:
                    status: "loaded"
                    model: "sentence-transformers/all-MiniLM-L6-v2"
                version: "1.0.0"
        '503':
          description: One or more services unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "degraded"
                timestamp: "2025-12-04T18:34:00Z"
                services:
                  qdrant:
                    status: "disconnected"
                    error: "Connection timeout after 5 seconds"
                  neon:
                    status: "connected"
                    latency_ms: 32
                  embedding_model:
                    status: "loaded"
                    model: "sentence-transformers/all-MiniLM-L6-v2"
                version: "1.0.0"

components:
  schemas:
    QueryRequest:
      type: object
      required:
        - query
        - chapter_id
      properties:
        selected_text:
          type: string
          description: Text selected by user before asking (provides context)
          minLength: 0
          maxLength: 500
          example: "ROS 2 uses DDS for communication between nodes"
        query:
          type: string
          description: User's question about book content
          minLength: 5
          maxLength: 500
          example: "What protocol does ROS 2 use for inter-process communication?"
        chapter_id:
          type: string
          description: Slug of chapter user is currently reading
          pattern: '^[a-z0-9-]+$'
          example: "ros-2-fundamentals"

    QueryResponse:
      type: object
      required:
        - answer
        - sources
        - latency_ms
      properties:
        answer:
          type: string
          description: AI-generated answer grounded in book content
          minLength: 10
          maxLength: 2000
          example: "ROS 2 uses DDS (Data Distribution Service) as its middleware communication protocol..."
        sources:
          type: array
          description: Book chapters/sections used to generate answer
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/Source'
        latency_ms:
          type: integer
          description: Total response time in milliseconds
          minimum: 0
          maximum: 10000
          example: 287
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'

    Source:
      type: object
      required:
        - chapter
        - section
        - relevance_score
      properties:
        chapter:
          type: string
          description: Chapter slug where content was found
          example: "ros-2-fundamentals"
        section:
          type: string
          description: Section heading within chapter
          example: "communication-middleware"
        relevance_score:
          type: number
          format: float
          description: Cosine similarity score (0.0-1.0)
          minimum: 0.0
          maximum: 1.0
          example: 0.94

    ResponseMetadata:
      type: object
      description: Performance metrics for debugging and monitoring
      properties:
        embedding_time_ms:
          type: integer
          description: Time to embed query using sentence-transformers
          example: 58
        qdrant_time_ms:
          type: integer
          description: Time to search Qdrant vector database
          example: 102
        num_chunks_retrieved:
          type: integer
          description: Number of text chunks retrieved from Qdrant
          example: 5

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - services
        - version
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: Overall system health status
          example: "healthy"
        timestamp:
          type: string
          format: date-time
          description: Health check timestamp (ISO 8601)
          example: "2025-12-04T18:33:00Z"
        services:
          type: object
          description: Individual service health statuses
          properties:
            qdrant:
              $ref: '#/components/schemas/ServiceHealth'
            neon:
              $ref: '#/components/schemas/ServiceHealth'
            embedding_model:
              $ref: '#/components/schemas/ServiceHealth'
        version:
          type: string
          description: API version
          example: "1.0.0"

    ServiceHealth:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [connected, disconnected, loaded, error]
          description: Service connection status
          example: "connected"
        latency_ms:
          type: integer
          description: Connection latency (if connected)
          example: 45
        model:
          type: string
          description: Model name (for embedding_model service)
          example: "sentence-transformers/all-MiniLM-L6-v2"
        error:
          type: string
          description: Error message (if status=disconnected/error)
          example: "Connection timeout after 5 seconds"

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - code
        - timestamp
      properties:
        error:
          type: string
          description: Human-readable error summary
          example: "Rate Limit Exceeded"
        message:
          type: string
          description: Detailed error message
          example: "Too many requests. Please wait 60 seconds before trying again."
        code:
          type: string
          description: Machine-readable error code
          enum:
            - INVALID_QUERY_LENGTH
            - CHAPTER_NOT_FOUND
            - RATE_LIMIT_EXCEEDED
            - BACKEND_UNAVAILABLE
            - INTERNAL_SERVER_ERROR
          example: "RATE_LIMIT_EXCEEDED"
        timestamp:
          type: string
          format: date-time
          description: Error occurrence timestamp (ISO 8601)
          example: "2025-12-04T18:31:00Z"

  securitySchemes: {}  # No authentication required (public API)

security: []  # No security requirements
